<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Danrak Productions - Communicating More</title>
    <meta name="description" content="Danrak Productions - Crafting cinematic experiences that captivate, inspire, and leave lasting impressions." />
    <meta name="author" content="Danrak Productions" />

    <meta property="og:title" content="Danrak Productions - Communicating More" />
    <meta property="og:description" content="Crafting cinematic experiences that captivate, inspire, and leave lasting impressions." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@itdebrakaye" />
    <meta name="twitter:title" content="Danrak Productions - Communicating More" />

    <!-- Warm up the font connection before the CSS request goes out -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Both families in a single request instead of two render-blocking ones -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/head-icon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/head-icon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/head-icon.ico" />
    <meta name="msapplication-TileImage" content="/head-icon.ico" />

    <!--
      Viewport class, set before the body is parsed.

      This runs synchronously in <head>, so `data-vp` is already correct on the
      very first paint — CSS and the inline loader can branch on screen size
      without waiting for the JS bundle. React's own layout switch reads
      window.innerWidth synchronously too, so the mobile tree is chosen on the
      first render rather than after a frame.
    -->
    <script>
      (function () {
        try {
          var w = window.innerWidth || document.documentElement.clientWidth;
          var el = document.documentElement;
          el.setAttribute('data-vp', w < 768 ? 'mobile' : w < 1280 ? 'tablet' : 'desktop');
          el.style.setProperty('--vw', w + 'px');
        } catch (e) {}
      })();
    </script>

    <!--
      Critical inline styles: this paints the moment the HTML arrives, with no
      dependency on the JS bundle or the external stylesheet. Without it the
      viewport stays blank until React mounts, which reads as a broken page.
    -->
    <style>
      html, body { margin: 0; padding: 0; background: #ffffff; }
      @media (prefers-color-scheme: dark) { html, body { background: #0a0a0a; } }
      #app-loader {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1.25rem; background: inherit;
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity .35s ease, visibility .35s ease;
      }
      #app-loader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .dl-mark { width: 64px; height: 64px; animation: dl-float 2.4s ease-in-out infinite; }
      .dl-word {
        font-size: .78rem; letter-spacing: .34em; text-transform: uppercase;
        color: #bf0052; font-weight: 600;
      }
      .dl-bar {
        width: 168px; height: 3px; border-radius: 99px; overflow: hidden;
        background: rgba(45,158,212,.18);
      }
      .dl-bar span {
        display: block; width: 40%; height: 100%; border-radius: 99px;
        background: linear-gradient(90deg,#2d9ed4,#44bae9,#bf0052);
        animation: dl-slide 1.15s cubic-bezier(.65,.05,.36,1) infinite;
      }
      @keyframes dl-slide { 0% { transform: translateX(-110%) } 100% { transform: translateX(310%) } }
      @keyframes dl-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
      @media (prefers-reduced-motion: reduce) {
        .dl-mark, .dl-bar span { animation: none; }
        .dl-bar span { width: 100%; }
      }
    </style>
  </head>

  <body>
    <!-- Branded first paint. Removed by main.tsx once React has mounted. -->
    <div id="app-loader" role="status" aria-live="polite" aria-label="Loading Danrak Productions">
      <svg class="dl-mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 6h16l12 18-8 12L4 6z" fill="#2d9ed4"/>
        <path d="M60 6H44L32 24l8 12L60 6z" fill="#80c257"/>
        <path d="M4 58h16l12-18-8-12L4 58z" fill="#44bae9"/>
        <path d="M60 58H44L32 40l8-12 20 30z" fill="#a2d180"/>
      </svg>
      <div class="dl-word">Danrak Productions</div>
      <div class="dl-bar"><span></span></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
